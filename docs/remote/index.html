<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>카리로에게 맡기기</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  :root {
    --bg: #f2f4f6; --card: #ffffff; --line: #e5e8eb; --ink: #191f28; --sub: #4e5968; --muted: #8b95a1;
    --brand: #3182f6; --brand-ink: #ffffff; --ok: #12a150; --warn: #c2410c; --bad: #e5484d; --chip: #f2f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #191d23; --line: #2a3038; --ink: #f2f4f6; --sub: #b0b8c1; --muted: #7d8692;
      --brand: #4c94ff; --brand-ink: #ffffff; --ok: #34c472; --warn: #f0883e; --bad: #ff6b6f; --chip: #232830;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #191d23; --line: #2a3038; --ink: #f2f4f6; --sub: #b0b8c1; --muted: #7d8692;
    --brand: #4c94ff; --brand-ink: #ffffff; --ok: #34c472; --warn: #f0883e; --bad: #ff6b6f; --chip: #232830;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 2px 14px; }
  header img { width: 28px; height: 28px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .device { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--sub); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 0 6px; }
  textarea, input { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; padding: 12px; outline: none; }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus, input:focus { border-color: var(--brand); }
  .row { margin-bottom: 12px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--brand); color: var(--brand-ink); width: 100%; }
  .ghost { background: var(--chip); color: var(--ink); }
  .danger { background: transparent; color: var(--bad); padding: 8px 0; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .buttons button { flex: 1 1 120px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .status { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--sub); }
  .status.done { color: var(--ok); } .status.failed { color: var(--bad); } .status.running, .status.starting { color: var(--brand); }
  .goal { font-weight: 600; margin: 8px 0 10px; word-break: break-word; }
  ol { margin: 0; padding-left: 20px; color: var(--sub); font-size: 13px; }
  ol li { margin: 2px 0; word-break: break-word; }
  .ask { border: 1.5px solid var(--warn); }
  .ask h2 { margin: 0 0 4px; font-size: 15px; }
  .ask p { margin: 0 0 12px; color: var(--sub); font-size: 13.5px; word-break: break-word; }
  .result { white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; }
  .error { color: var(--bad); font-size: 13.5px; margin: 8px 0 0; }
  .empty h2 { font-size: 16px; margin: 0 0 6px; }
  .empty p { color: var(--sub); margin: 0; font-size: 14px; }
  a { color: var(--brand); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="../assets/favicon.svg" alt="">
    <h1>카리로에게 맡기기</h1>
  </header>

  <section id="unpaired" class="card empty" hidden>
    <h2>맥의 카리로와 아직 연결되지 않았어요</h2>
    <p>맥에서 카리로 › 설정 › 폰에서 맡기기를 켜고, 나온 QR 을 이 폰 카메라로 찍어 주세요.</p>
  </section>

  <div id="paired" hidden>
    <section class="card">
      <div class="device"><span id="dot" class="dot"></span><span id="deviceText">맥 확인 중…</span></div>
    </section>

    <form id="form" class="card">
      <div class="row">
        <label for="goal">무엇을 맡길까요?</label>
        <textarea id="goal" maxlength="500" placeholder="예: 쿠팡에서 생수 2L 12개 찾아서 장바구니까지 담아 줘" required></textarea>
      </div>
      <div class="row">
        <label for="site">시작할 사이트(비워 두면 카리로가 골라요)</label>
        <input id="site" inputmode="url" autocomplete="off" placeholder="예: coupang.com">
      </div>
      <button id="send" class="primary" type="submit">맡기기</button>
      <p id="formError" class="error" hidden></p>
      <p class="hint">결제 · 예약 · 보내기 같은 일은 진행 전에 여기나 맥에서 승인해야 해요.</p>
    </form>

    <section id="ask" class="card ask" hidden>
      <h2 id="askTitle"></h2>
      <p id="askText"></p>
      <div id="askButtons" class="buttons"></div>
    </section>

    <section id="run" class="card" hidden>
      <span id="runStatus" class="status"></span>
      <div id="runGoal" class="goal"></div>
      <ol id="runSteps"></ol>
      <p id="runResult" class="result" hidden></p>
      <div class="buttons" style="margin-top:12px">
        <button id="cancel" class="ghost" type="button" hidden>멈추기</button>
      </div>
    </section>

    <button id="unpair" class="danger" type="button">이 폰 연결 끊기</button>
  </div>
</main>
<script>
(() => {
  'use strict'
  const STORE = 'cariro-remote-pair'
  const $ = (id) => document.getElementById(id)
  const STATUS_TEXT = { starting: '시작하는 중', running: '하는 중', done: '다 했어요', failed: '하지 못했어요', cancelled: '멈췄어요' }

  // QR 주소(# 뒤)의 키를 이 폰에만 저장하고 주소창에서 지워요. # 뒤는 서버로 가지 않아요.
  const readPair = () => {
    const hash = new URLSearchParams(location.hash.slice(1))
    const key = hash.get('k'), device = hash.get('d'), api = hash.get('a')
    if (key && device && api && /^(https:\/\/|http:\/\/(127\.0\.0\.1|localhost)(:\d+)?(\/|$))/.test(api)) {
      try { localStorage.setItem(STORE, JSON.stringify({ key, device, api: api.replace(/\/+$/, '') })) } catch { /* 저장이 막힌 브라우저 */ }
      history.replaceState(null, '', location.pathname)
      return { key, device, api: api.replace(/\/+$/, '') }
    }
    try { return JSON.parse(localStorage.getItem(STORE) || 'null') } catch { return null }
  }
  const pair = readPair()
  if (!pair) { $('unpaired').hidden = false; return }
  $('paired').hidden = false

  const api = (path, init = {}) => fetch(pair.api + path, { ...init, headers: { 'content-type': 'application/json', 'x-api-key': pair.key } })
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

  // 맥에 명령 하나를 보내고 맥이 돌려준 결과를 기다려요(맥은 2~3초마다 가져가요).
  const send = async (action, params = {}) => {
    const queued = await api('/v1/pc/command', { method: 'POST', body: JSON.stringify({ device_id: pair.device, action, params }) })
    const body = await queued.json().catch(() => ({}))
    if (!queued.ok) throw new Error(body.message || body.error || `보내지 못했어요 (${queued.status})`)
    for (let i = 0; i < 40; i += 1) {
      await sleep(i < 4 ? 500 : 900)
      const res = await api(`/v1/pc/result/${encodeURIComponent(body.command_id)}?device_id=${encodeURIComponent(pair.device)}`)
      const cmd = await res.json().catch(() => ({}))
      if (cmd.status === 'done' || cmd.status === 'failed') return cmd.result || { ok: false, detail: '결과가 비어 있어요.' }
    }
    throw new Error('맥이 응답하지 않아요. 맥과 카리로가 켜져 있는지 확인해 주세요.')
  }

  let online = false
  const checkDevice = async () => {
    try {
      const res = await api('/v1/pc/devices')
      if (res.status === 401 || res.status === 403) {
        online = false
        $('deviceText').textContent = '연결이 끊겼어요. 맥에서 QR 을 다시 찍어 주세요.'
        $('dot').className = 'dot'
        return
      }
      const data = await res.json().catch(() => ({}))
      const list = Array.isArray(data.devices) ? data.devices : Array.isArray(data) ? data : []
      const me = list.find((d) => d.device_id === pair.device)
      online = Boolean(me && me.online && !me.disabled)
      $('dot').className = online ? 'dot on' : 'dot'
      $('deviceText').textContent = me ? (online ? `${me.name || '맥'} · 연결됨` : `${me.name || '맥'} · 꺼져 있거나 카리로가 닫혀 있어요`) : '맥을 찾지 못했어요. 맥에서 QR 을 다시 찍어 주세요.'
    } catch {
      $('deviceText').textContent = '인터넷 연결을 확인해 주세요.'
    }
  }

  let runId = null
  let lastAsk = ''
  const render = (run) => {
    if (!run) return
    $('run').hidden = false
    $('runStatus').textContent = STATUS_TEXT[run.status] || run.status
    $('runStatus').className = `status ${run.status}`
    $('runGoal').textContent = run.goal
    const steps = $('runSteps')
    steps.replaceChildren(...(run.steps || []).map((line) => Object.assign(document.createElement('li'), { textContent: line })))
    const live = run.status === 'starting' || run.status === 'running'
    $('cancel').hidden = !live
    $('send').disabled = live
    $('runResult').hidden = live || !run.result
    $('runResult').textContent = run.result + (run.url ? `\n${run.url}` : '')
    const ask = live ? run.ask : null
    $('ask').hidden = !ask
    const askKey = ask ? ask.id : ''
    if (ask && askKey !== lastAsk) {
      $('askTitle').textContent = ask.kind === 'approval' ? '승인이 필요해요' : '골라 주세요'
      $('askText').textContent = ask.kind === 'approval' ? `${ask.text}${ask.detail ? ` (${ask.detail})` : ''}` : ask.text
      const buttons = ask.kind === 'approval'
        ? [['승인', 'primary', { accept: true }], ['거절', 'ghost', { accept: false }]]
        : [...(ask.options || []).map((o) => [o.label, 'ghost', { option: o.id }]), ['취소', 'ghost', { option: null }]]
      $('askButtons').replaceChildren(...buttons.map(([text, cls, answer]) => {
        const b = Object.assign(document.createElement('button'), { type: 'button', textContent: text, className: cls })
        b.addEventListener('click', async () => {
          $('askButtons').querySelectorAll('button').forEach((x) => { x.disabled = true })
          try {
            const res = await send('agent_respond', { run_id: run.run_id, ask_id: ask.id, ...answer })
            if (!res.ok) $('askText').textContent = res.detail || '이미 끝난 요청이에요.'
          } catch (e) { $('askText').textContent = e.message }
        })
        return b
      }))
    }
    lastAsk = askKey
  }

  let polling = false
  const follow = async () => {
    if (polling) return
    polling = true
    try {
      while (runId) {
        const res = await send('agent_status', { run_id: runId }).catch(() => null)
        if (res && res.ok && res.data) {
          render(res.data)
          if (!['starting', 'running'].includes(res.data.status)) break
        }
        await sleep(2500)
      }
    } finally { polling = false }
  }

  $('form').addEventListener('submit', async (event) => {
    event.preventDefault()
    const goal = $('goal').value.trim()
    if (!goal) return
    $('formError').hidden = true
    await checkDevice()
    if (!online) {
      $('formError').textContent = '맥이 꺼져 있거나 카리로가 닫혀 있어요. 켜 둔 뒤 다시 맡겨 주세요.'
      $('formError').hidden = false
      return
    }
    $('send').disabled = true
    $('send').textContent = '보내는 중…'
    try {
      const site = $('site').value.trim()
      const res = await send('agent_goal', { goal, url: site ? (/^https?:\/\//i.test(site) ? site : `https://${site}`) : '', sent_at: Date.now() })
      if (!res.ok) throw new Error(res.detail || '맡기지 못했어요.')
      runId = res.data.run_id
      lastAsk = ''
      render({ run_id: runId, goal, status: 'starting', steps: [], ask: null, result: '' })
      $('goal').value = ''
      void follow()
    } catch (e) {
      $('formError').textContent = e.message
      $('formError').hidden = false
      $('send').disabled = false
    } finally {
      $('send').textContent = '맡기기'
    }
  })

  $('cancel').addEventListener('click', async () => {
    $('cancel').disabled = true
    try { await send('agent_cancel', { run_id: runId }) } catch { /* 상태로 보여요 */ }
    $('cancel').disabled = false
  })

  $('unpair').addEventListener('click', () => {
    if (!confirm('이 폰의 연결을 끊을까요? 다시 쓰려면 맥에서 QR 을 다시 찍어야 해요.')) return
    try { localStorage.removeItem(STORE) } catch { /* 없음 */ }
    location.reload()
  })

  // 열 때: 맥 상태를 보고, 하던 일이 있으면 이어서 보여 줘요.
  void (async () => {
    await checkDevice()
    if (!online) return
    const res = await send('ping').catch(() => null)
    const run = res && res.ok && res.data && res.data.run
    if (run) {
      runId = run.run_id
      render(run)
      if (['starting', 'running'].includes(run.status)) void follow()
    }
  })()
  setInterval(() => { if (!document.hidden) void checkDevice() }, 15000)
})()
</script>
</body>
</html>
